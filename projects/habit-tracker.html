<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Habit Tracker — Adarsh Pawar</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fc;color:#172335;font-family:Arial,sans-serif}.wrap{width:min(820px,calc(100% - 2rem));margin:auto}.top{display:flex;justify-content:space-between;padding:1.4rem 0;border-bottom:1px solid #bdcad8;font-size:.8rem;font-weight:bold}.top a{color:inherit;text-decoration:none}.app{padding:5rem 0}.tag{font:12px monospace;letter-spacing:.1em}.intro{display:flex;justify-content:space-between;gap:2rem;align-items:end}.intro h1{font-size:clamp(3rem,10vw,5.5rem);letter-spacing:-.09em;line-height:.9;margin:.8rem 0}.intro p{max-width:270px;color:#53677b;line-height:1.6}.board{margin-top:2rem;padding:1.2rem;background:white;border-radius:14px;box-shadow:9px 9px 0 #c9ddeb;overflow:auto}.days,.habit{display:grid;grid-template-columns:1.8fr repeat(7,.65fr);gap:.5rem;min-width:590px}.days{font:11px monospace;color:#63778e;text-align:center;padding:.4rem}.habit{align-items:center;border-top:1px solid #d9e1e8;padding:1rem .4rem}.habit label{font-weight:bold;font-size:.9rem}.habit button{width:28px;height:28px;justify-self:center;border:1px solid #c4d0db;border-radius:8px;background:#f6f9fb;cursor:pointer;font-weight:bold}.habit button.done{background:#ffd85b;border-color:#172335}.footer{margin-top:1.6rem;font-size:.8rem;color:#53677b}.footer b{padding:.4rem .6rem;background:#ffd85b;color:#172335;border-radius:4px}@media(max-width:600px){.intro{display:block}.intro p{margin-top:1.5rem}}
</style></head><body><main class="wrap"><header class="top"><a href="../index.html">← Portfolio</a><b>HABIT TRACKER</b><span>02</span></header><section class="app"><div class="intro"><div><p class="tag">A WEEKLY CHECK-IN BOARD</p><h1>Small things.<br>Big change.</h1></div><p>Click a square whenever you keep a promise to yourself. Small consistency adds up.</p></div><div class="board"><div class="days"><span></span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="habit"><label>Move my body</label><button>+</button><button>+</button><button>+</button><button>+</button><button>+</button><button>+</button><button>+</button></div><div class="habit"><label>Learn something</label><button>+</button><button>+</button><button>+</button><button>+</button><button>+</button><button>+</button><button>+</button></div><div class="habit"><label>Build for 30 min</label><button>+</button><button>+</button><button>+</button><button>+</button><button>+</button><button>+</button><button>+</button></div></div><p class="footer">Built by Adarsh Pawar · <b><span id="count">0</span> check-ins this week</b></p></section></main><script>const count=document.querySelector('#count');document.querySelectorAll('.habit button').forEach(b=>b.onclick=()=>{b.classList.toggle('done');b.textContent=b.classList.contains('done')?'✓':'+';count.textContent=document.querySelectorAll('.done').length})</script></body></html>
