<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Palette Maker — Adarsh Pawar</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f1e6;color:#241f29;font-family:Arial,sans-serif}.wrap{width:min(860px,calc(100% - 2rem));margin:auto}.top{display:flex;justify-content:space-between;padding:1.4rem 0;border-bottom:1px solid #c9c0b4;font-size:.8rem;font-weight:bold}.top a{color:inherit;text-decoration:none}.app{text-align:center;padding:5rem 0}.tag{font:12px monospace;letter-spacing:.1em}.app h1{font-size:clamp(3rem,10vw,5.8rem);line-height:.9;letter-spacing:-.1em;margin:.8rem 0}.copy{max-width:450px;margin:0 auto 2.2rem;color:#655d69;line-height:1.6}.palette{display:grid;grid-template-columns:repeat(5,1fr);min-height:320px;border-radius:16px;overflow:hidden;box-shadow:9px 9px 0 #342e3d}.color{display:flex;align-items:end;padding:.8rem;cursor:pointer;transition:transform .2s}.color:hover{transform:scale(.98)}.color span{padding:.3rem;background:#ffffffb8;border-radius:3px;font:11px monospace}.action{margin-top:2rem;border:0;border-radius:4px;padding:.9rem 1.1rem;background:#241f29;color:white;font-weight:bold;cursor:pointer}.message{height:1.4rem;color:#655d69;font:12px monospace}@media(max-width:500px){.palette{min-height:210px}.color span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:8px}}
</style></head><body><main class="wrap"><header class="top"><a href="../index.html">← Portfolio</a><b>PALETTE MAKER</b><span>03</span></header><section class="app"><p class="tag">A PLAYFUL COLOR TOOL</p><h1>Make colour<br>feel easy.</h1><p class="copy">Generate a five-colour palette with one click. Click any colour to copy its code for your next idea.</p><div class="palette" id="palette"></div><button class="action" id="new">Generate a palette ↻</button><p class="message" id="message">Click a colour to copy its hex code.</p></section></main><script>const palettes=[['#ffdb77','#e76f51','#f4a261','#264653','#2a9d8f'],['#d8f171','#6d9dc5','#4d4c7d','#342e37','#f8f1e6'],['#ff9f68','#f9dc5c','#ef8354','#4f5d75','#2d3142']];let i=0;const palette=document.querySelector('#palette'),message=document.querySelector('#message');function render(){palette.innerHTML='';palettes[i].forEach(hex=>{const c=document.createElement('div');c.className='color';c.style.background=hex;c.innerHTML='<span>'+hex+'</span>';c.onclick=()=>{navigator.clipboard.writeText(hex);message.textContent=hex+' copied to clipboard'};palette.append(c)})}document.querySelector('#new').onclick=()=>{i=(i+1)%palettes.length;message.textContent='Fresh palette, ready to explore.';render()};render()</script></body></html>
