<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Focus Desk — Adarsh Pawar</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#1b1c1b;font-family:Arial,sans-serif}.wrap{width:min(760px,calc(100% - 2rem));margin:auto}.top{display:flex;justify-content:space-between;padding:1.4rem 0;border-bottom:1px solid #bbb7ae;font-size:.8rem;font-weight:bold}.top a{color:inherit;text-decoration:none}.app{text-align:center;padding:5rem 0}.tag{font:12px monospace;letter-spacing:.1em}.app h1{font-size:clamp(3rem,10vw,5.5rem);letter-spacing:-.08em;line-height:.9;margin:.8rem 0 1rem}.copy{max-width:420px;margin:0 auto 2.2rem;color:#5f625c;line-height:1.6}.timer{background:#20221f;color:#f4f1e9;padding:2rem;border-radius:16px;box-shadow:9px 9px 0 #d6fa5d}.time{font-size:clamp(4rem,17vw,8rem);font-weight:800;letter-spacing:-.1em}.status{font:12px monospace;color:#b6b8af}.buttons{display:flex;justify-content:center;gap:.7rem;margin-top:1.7rem}.buttons button{border:0;padding:.85rem 1rem;border-radius:5px;background:#d6fa5d;font-weight:bold;cursor:pointer}.buttons button+button{background:transparent;color:white;border:1px solid #777}
</style></head><body><main class="wrap"><header class="top"><a href="../index.html">← Portfolio</a><b>FOCUS DESK</b><span>01</span></header><section class="app"><p class="tag">A PRODUCTIVITY TOOL</p><h1>Make room<br>for focus.</h1><p class="copy">A small Pomodoro timer for calm study sessions. Make one promise: stay with it until the bell rings.</p><div class="timer"><div id="time" class="time">25:00</div><p id="status" class="status">READY WHEN YOU ARE</p><div class="buttons"><button id="start">Start focus</button><button id="reset">Reset</button></div></div></section></main><script>const time=document.querySelector('#time'),status=document.querySelector('#status'),start=document.querySelector('#start');let seconds=1500,timer;function draw(){time.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}function stop(){clearInterval(timer);timer=null;start.textContent='Start focus'}start.onclick=()=>{if(timer){stop();return}timer=setInterval(()=>{if(seconds<=0){stop();status.textContent='SESSION COMPLETE — NICE WORK';return}seconds--;draw()},1000);status.textContent='ONE THING AT A TIME';start.textContent='Pause'};document.querySelector('#reset').onclick=()=>{stop();seconds=1500;status.textContent='READY WHEN YOU ARE';draw()}</script></body></html>
